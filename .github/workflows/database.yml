name: Database
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Replay migrations in disposable Supabase
        run: npx --no-install supabase start
      - name: Verify actual database permissions and search
        run: npx --no-install supabase test db --local
